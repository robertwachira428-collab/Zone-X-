
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZONE X — Your World</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#070b14;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}
header{
  padding:22px;
  border-bottom:1px solid #17243a;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:25px;font-weight:900;color:#39a9ff}
.logo span{color:white}
main{max-width:500px;margin:35px auto;padding:20px}
h1{font-size:30px;margin-bottom:10px}
h2{margin-bottom:15px}
.subtitle{color:#9aabc2;margin-bottom:25px;line-height:1.5}
.panel{
  background:#101a2b;
  border:1px solid #203653;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
}
input,textarea{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:9px;
  border:1px solid #30435e;
  background:#08111f;
  color:white;
  font-size:15px;
}
textarea{resize:vertical}
label{display:block;margin-top:12px;color:#c8d8eb}
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  background:#1689e8;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5}
.switch{background:transparent;border:1px solid #1689e8}
#message,#accountMessage,#zx-message{
  margin-top:15px;
  color:#65bdff;
  line-height:1.5;
  overflow-wrap:anywhere;
}
#account,#zx-profile{display:none}
footer{
  text-align:center;
  color:#71829b;
  padding:30px 15px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">ZONE <span>X</span></div>
  <div style="color:#8fa9c7;font-size:12px">YOUR WORLD</div>
</header>

<main>

<section id="auth">
  <h1>Your world.<br>Your people. Your zone.</h1>
  <p class="subtitle">
    Connect with people, share your moments and discover your world.
  </p>

  <div class="panel">
    <h2 id="formTitle">Create your account</h2>

    <div id="signupFields">
      <input id="fullName" placeholder="Full name">
      <input id="username" placeholder="Username">
    </div>

    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">

    <div id="confirmField">
      <input id="confirmPassword" type="password" placeholder="Confirm password">
    </div>

    <button id="submitButton" onclick="submitForm()">Create account</button>

    <button class="switch" id="switchButton" onclick="switchMode()">
      Already have an account? Log in
    </button>

    <button class="switch" id="forgotButton"
      onclick="forgotPassword()" style="display:none">
      Forgot password?
    </button>

    <p id="message" role="status"></p>
  </div>
</section>

<section id="account" class="panel">
  <h1>Welcome to ZONE X</h1>
  <p class="subtitle" id="welcomeText"></p>
  <p>Your account is connected.</p>
  <button onclick="logout()">Log out</button>
  <p id="accountMessage"></p>
</section>

<section id="zx-profile" class="panel">
  <h2 style="color:#38bdf8">My ZONE X Profile</h2>

  <p id="zx-username">Username: Loading...</p>

  <label for="zx-display">Display name</label>
  <input id="zx-display" maxlength="40" placeholder="Your display name">

  <label for="zx-bio">Bio</label>
  <textarea id="zx-bio" maxlength="160" rows="3"
    placeholder="Tell people about yourself"></textarea>

  <button id="zx-save" onclick="saveProfile()">Save Profile</button>
  <p id="zx-message"></p>
</section>

</main>

<footer>ZONE X © 2026 — Your world. Your people. Your zone.</footer>

<script>
const SUPABASE_URL =
  'https://cgpdynonyvharrwomnxh.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_fBcAIPiNoya-y9Aguou-nQ_aqTgsP-u';

const REDIRECT_URL =
  'https://robertwachira428-collab.github.io/Zone-X-/';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let isSignup = true;
let isRecovery = false;
let currentUser = null;

function showMessage(text){
  document.getElementById('message').textContent = text;
}

function switchMode(){
  isSignup = !isSignup;
  isRecovery = false;

  document.getElementById('formTitle').textContent =
    isSignup ? 'Create your account' : 'Welcome back';

  document.getElementById('signupFields').style.display =
    isSignup ? 'block' : 'none';

  document.getElementById('confirmField').style.display =
    isSignup ? 'block' : 'none';

  document.getElementById('submitButton').textContent =
    isSignup ? 'Create account' : 'Log in';

  document.getElementById('switchButton').textContent =
    isSignup ? 'Already have an account? Log in' : 'Create a new account';

  document.getElementById('switchButton').style.display = 'block';

  document.getElementById('forgotButton').style.display =
    isSignup ? 'none' : 'block';

  showMessage('');
}

async function submitForm(){
  const button = document.getElementById('submitButton');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if(!password || (!isRecovery && !email)){
    showMessage('Please complete the required fields.');
    return;
  }

  if(password.length < 6){
    showMessage('Password must have at least 6 characters.');
    return;
  }

  button.disabled = true;
  showMessage('Please wait...');

  try{

    // PASSWORD RECOVERY: SAVE NEW PASSWORD
    if(isRecovery){
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if(password !== confirmPassword){
        showMessage('Your passwords do not match.');
        return;
      }

      const {error} = await supabaseClient.auth.updateUser({
        password: password
      });

      if(error) throw error;

      isRecovery = false;
      document.getElementById('confirmField').style.display = 'none';
      document.getElementById('switchButton').style.display = 'block';
      document.getElementById('forgotButton').style.display = 'none';

      showMessage('Password updated successfully. You can now log in.');
      document.getElementById('formTitle').textContent = 'Welcome back';
      document.getElementById('submitButton').textContent = 'Log in';
      isSignup = false;
      return;
    }

    // CREATE ACCOUNT
    if(isSignup){
      const fullName =
        document.getElementById('fullName').value.trim();

      const username =
        document.getElementById('username').value.trim();

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if(!fullName || !username){
        showMessage('Enter your full name and username.');
        return;
      }

      if(password !== confirmPassword){
        showMessage('Your passwords do not match.');
        return;
      }

      if(!/^[a-zA-Z0-9_]{3,24}$/.test(username)){
        showMessage('Username must be 3–24 letters, numbers or underscores.');
        return;
      }

      const {data,error} = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options:{
          emailRedirectTo: REDIRECT_URL,
          data:{
            full_name: fullName,
            username: username
          }
        }
      });

      if(error) throw error;

      if(data.session){
        showMessage('Account created successfully!');
        await showAccount(data.user);
      }else{
        showMessage('Account created. Check your email for confirmation.');
      }

    }else{

      // LOGIN
      const {data,error} =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if(error) throw error;

      await showAccount(data.user);
      showMessage('Login successful!');
    }

  }catch(error){
    showMessage(error.message || 'Something went wrong.');
  }finally{
    button.disabled = false;
  }
}

async function forgotPassword(){
  const email = document.getElementById('email').value.trim();

  if(!email){
    showMessage('Enter your account email first.');
    return;
  }

  const button = document.getElementById('forgotButton');
  button.disabled = true;
  showMessage('Sending password reset request...');

  try{
    const {error} =
      await supabaseClient.auth.resetPasswordForEmail(email,{
        redirectTo: REDIRECT_URL
      });

    if(error) throw error;

    showMessage('Password reset requested. Check your email.');
  }catch(error){
    showMessage(error.message || 'Could not request password reset.');
  }finally{
    button.disabled = false;
  }
}

async function showAccount(user){
  currentUser = user;

  document.getElementById('auth').style.display = 'none';
  document.getElementById('account').style.display = 'block';
  document.getElementById('zx-profile').style.display = 'block';

  const name =
    user.user_metadata?.full_name || user.email || 'ZONE X member';

  document.getElementById('welcomeText').textContent =
    'Welcome, ' + name;

  await loadProfile();
}

async function loadProfile(){
  const message = document.getElementById('zx-message');
  message.textContent = 'Loading profile...';

  const {data:profile,error} = await supabaseClient
    .from('profiles')
    .select('username,full_name,display_name,bio')
    .eq('id',currentUser.id)
    .single();

  if(error || !profile){
    message.textContent = 'Could not load profile. Please try again.';
    return;
  }

  document.getElementById('zx-username').textContent =
    '@' + profile.username;

  document.getElementById('zx-display').value =
    profile.display_name || profile.full_name || '';

  document.getElementById('zx-bio').value =
    profile.bio || '';

  message.textContent = '';
}

async function saveProfile(){
  if(!currentUser) return;

  const button = document.getElementById('zx-save');
  const display_name =
    document.getElementById('zx-display').value.trim();

  const bio =
    document.getElementById('zx-bio').value.trim();

  const message = document.getElementById('zx-message');

  if(!display_name){
    message.textContent = 'Enter a display name.';
    return;
  }

  button.disabled = true;
  message.textContent = 'Saving profile...';

  try{
    const {error} = await supabaseClient
      .from('profiles')
      .update({display_name,bio})
      .eq('id',currentUser.id);

    if(error) throw error;

    message.textContent = 'Profile saved successfully!';
  }catch(error){
    message.textContent = error.message || 'Could not save profile.';
  }finally{
    button.disabled = false;
  }
}

async function logout(){
  const {error} = await supabaseClient.auth.signOut();

  if(error){
    document.getElementById('accountMessage').textContent = error.message;
    return;
  }

  currentUser = null;

  document.getElementById('account').style.display = 'none';
  document.getElementById('zx-profile').style.display = 'none';
  document.getElementById('auth').style.display = 'block';

  showMessage('You have logged out.');
}

async function checkSession(){
  const {data,error} = await supabaseClient.auth.getSession();

  if(error){
    showMessage('Could not check your session. Please log in.');
    return;
  }

  if(data.session){
    await showAccount(data.session.user);
  }
}

// DETECT PASSWORD RECOVERY LINK
supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event === 'PASSWORD_RECOVERY'){
    isRecovery = true;
    isSignup = false;

    document.getElementById('auth').style.display = 'block';
    document.getElementById('account').style.display = 'none';
    document.getElementById('zx-profile').style.display = 'none';

    document.getElementById('formTitle').textContent =
      'Set a new password';

    document.getElementById('signupFields').style.display = 'none';
    document.getElementById('confirmField').style.display = 'block';
    document.getElementById('switchButton').style.display = 'none';
    document.getElementById('forgotButton').style.display = 'none';
    document.getElementById('submitButton').textContent =
      'Update password';

    showMessage('Enter and confirm your new password.');
  }
});

checkSession();
</script>

</body>
</html>
